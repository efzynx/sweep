name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0-beta)'
        required: true
        default: 'v1.0.0-beta'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install System GUI & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Validate Desktop File
        run: desktop-file-validate build/linux/io.github.efzynx.sweep.desktop

      - name: Build & Sync Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          cd ..

      - name: Build Release Binaries & Packages
        run: |
          mkdir -p release staging
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VERSION="${TAG_NAME#v}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Installing nfpm packager..."
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$(go env GOPATH)/bin:$PATH"

          echo "Building CLI binaries for tag ${TAG_NAME}..."
          for ARCH in amd64 arm64; do
            echo "Building CLI for linux/${ARCH}..."
            CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} go build \
              -ldflags "-s -w -X main.Version=${TAG_NAME} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
              -o release/sweep-linux-${ARCH} ./cmd/sweep
            
            # Create CLI tarball
            tar -czf release/sweep-${TAG_NAME}-linux-${ARCH}.tar.gz -C release sweep-linux-${ARCH} -C ../ README.md LICENSE

            # Generate .deb and .rpm for CLI
            cp release/sweep-linux-${ARCH} staging/sweep
            ARCH=${ARCH} VERSION=${CLEAN_VERSION} nfpm package --config build/package/nfpm-cli.yaml --packager deb --target release/
            ARCH=${ARCH} VERSION=${CLEAN_VERSION} nfpm package --config build/package/nfpm-cli.yaml --packager rpm --target release/
            if [ "${ARCH}" = "amd64" ]; then
              ARCH=amd64 VERSION=${CLEAN_VERSION} nfpm package --config build/package/nfpm-cli.yaml --packager archlinux --target release/
            fi
            rm -f staging/sweep
          done

          echo "Building Desktop GUI binary (linux/amd64)..."
          go build -tags "production,webkit2_41" \
            -ldflags "-s -w -X main.Version=${TAG_NAME} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o release/sweep-gui-linux-amd64 ./cmd/sweep-gui

          # Package GUI bundle including desktop entry and icons
          GUI_BUNDLE_DIR="release/sweep-gui-${TAG_NAME}-linux-amd64"
          mkdir -p "${GUI_BUNDLE_DIR}"
          cp release/sweep-gui-linux-amd64 "${GUI_BUNDLE_DIR}/sweep-gui"
          cp release/sweep-linux-amd64 "${GUI_BUNDLE_DIR}/sweep"
          cp README.md LICENSE "${GUI_BUNDLE_DIR}/"
          mkdir -p "${GUI_BUNDLE_DIR}/build"
          cp -r build/linux "${GUI_BUNDLE_DIR}/build/"
          
          tar -czf release/sweep-gui-${TAG_NAME}-linux-amd64.tar.gz -C release "sweep-gui-${TAG_NAME}-linux-amd64"
          rm -rf "${GUI_BUNDLE_DIR}"

          # Generate .deb, .rpm, and .pkg.tar.zst for Desktop GUI
          cp release/sweep-gui-linux-amd64 staging/sweep-gui
          cp release/sweep-linux-amd64 staging/sweep
          ARCH=amd64 VERSION=${CLEAN_VERSION} nfpm package --config build/package/nfpm-gui.yaml --packager deb --target release/
          ARCH=amd64 VERSION=${CLEAN_VERSION} nfpm package --config build/package/nfpm-gui.yaml --packager rpm --target release/
          ARCH=amd64 VERSION=${CLEAN_VERSION} nfpm package --config build/package/nfpm-gui.yaml --packager archlinux --target release/
          rm -rf staging

          # Generate SHA256 checksums
          cd release
          sha256sum sweep-*.tar.gz sweep-*.deb sweep-*.rpm sweep-*.pkg.tar.zst sweep-linux-* sweep-gui-linux-* > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sweep ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/sweep-linux-*
            release/sweep-gui-linux-*
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-beta') || contains(github.event.inputs.tag || github.ref_name, '-alpha') || contains(github.event.inputs.tag || github.ref_name, '-rc') }}
