name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Desktop File Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Validate Desktop File
        run: desktop-file-validate build/linux/io.github.efzynx.sweep.desktop

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build-cli:
    name: Cross-Compile CLI Matrix
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" -o dist/sweep-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sweep

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sweep-${{ matrix.goos }}-${{ matrix.goarch }}

  build-gui:
    name: Build Desktop GUI Matrix
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            tags: "production,webkit2_41"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install System GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build & Sync Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Build Desktop GUI Binary
        run: |
          mkdir -p dist
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -tags "${{ matrix.target.tags }}" -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" -o dist/sweep-gui-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/sweep-gui

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sweep-gui-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/sweep-gui-${{ matrix.target.os }}-${{ matrix.target.arch }}
