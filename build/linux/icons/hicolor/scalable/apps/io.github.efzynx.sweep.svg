<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Nordic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="50%" stop-color="#0c111a"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Squircle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Terminal Prompt Chevron Gradient -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Vacuum Cleaning Beam Rays Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Element -->
  <circle cx="240" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Squircle Canvas Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Inset Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Terminal Cleaning Particle Rays (Vacuum Beam) -->
  <g id="vacuum-beams">
    <!-- Center Beam -->
    <line x1="230" y1="256" x2="395" y2="256" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Upper Ray -->
    <line x1="236" y1="205" x2="370" y2="166" stroke="url(#beamGrad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Lower Ray -->
    <line x1="236" y1="307" x2="370" y2="346" stroke="url(#beamGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Subtle Wide Glow Cone -->
    <path d="M 220 256 L 390 140 C 420 200 420 312 390 372 Z" fill="#06b6d4" opacity="0.06"/>
  </g>

  <!-- Terminal Prompt Chevron Bracket ('>') -->
  <path d="M 122 154 L 218 256 L 122 358" fill="none" stroke="url(#promptGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Chevron Shimmer Core Line -->
  <path d="M 124 154 L 214 256 L 124 358" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Disintegrating Data & Cache Bits (Cleaning Action) -->
  <rect x="396" y="154" width="18" height="18" rx="4" fill="#a5f3fc" opacity="0.85"/>
  <rect x="428" y="247" width="16" height="16" rx="3.5" fill="#38bdf8" opacity="0.9"/>
  <rect x="402" y="334" width="22" height="22" rx="5" fill="#22d3ee" opacity="0.75"/>
  <rect x="345" y="210" width="12" height="12" rx="3" fill="#e0f2fe" opacity="0.7"/>
  <rect x="354" y="288" width="14" height="14" rx="3.5" fill="#67e8f9" opacity="0.65"/>

  <!-- Clean Starburst Sparkles -->
  <!-- Primary Sparkle -->
  <path d="M 334 236 L 338 250 L 352 254 L 338 258 L 334 272 L 330 258 L 316 254 L 330 250 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Secondary Top Sparkle -->
  <path d="M 195 110 L 198 120 L 208 123 L 198 126 L 195 136 L 192 126 L 182 123 L 192 120 Z" fill="#38bdf8" opacity="0.9"/>
  
  <!-- Ambient Sparkle Dots -->
  <circle cx="295" cy="190" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="318" cy="318" r="4" fill="#67e8f9" opacity="0.8"/>
  <circle cx="438" cy="198" r="3" fill="#a5f3fc" opacity="0.7"/>
  <circle cx="434" cy="312" r="3.5" fill="#38bdf8" opacity="0.75"/>
</svg>
