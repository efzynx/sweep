# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: "sweep"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Ahmad Fauzan Adiman (Efzyn) <me@efzyn.my.id>"
description: "Modern Multi-Distro Linux System Cleaner & Maintenance Tool (CLI & TUI)"
vendor: "Efzyn"
homepage: "https://github.com/efzynx/sweep"
license: "MIT"
contents:
  - src: ./staging/sweep
    dst: /usr/bin/sweep
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/sweep/README.md
  - src: LICENSE
    dst: /usr/share/doc/sweep/LICENSE
